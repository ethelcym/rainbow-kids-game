  if(result&&result.catch)result.catch(()=>{if(currentAudio===player){voiceStatus('Safari 未能啟動音訊，請再撳一次 🔊');currentAudio=null;}});
}

function render(){answered=false;const q=sets[mode][round];$('score').textContent=score;$('question').textContent=q.zh;$('english').textContent=q.en;$('mascot').textContent=q.mascot;$('feedback').className='hidden';$('feedback').textContent='';$('next').classList.add('hidden');$('skip').classList.remove('hidden');$('progress').replaceChildren(...[0,1,2].map(i=>{const d=document.createElement('span');d.className='dot'+(i===round?' active':'');return d}));document.querySelectorAll('.mode').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('choices').replaceChildren(...q.options.map(o=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-label',o[2]);const e=document.createElement('span');e.className='emoji';e.textContent=o[1];const l=document.createElement('span');l.className='label';l.textContent=o[2];b.append(e,l);b.onclick=()=>pick(o[0],b);return b}));}
function pick(value,button){if(answered)return;const q=sets[mode][round];const fb=$('feedback');if(value===q.correct){answered=true;score++;$('score').textContent=score;button.classList.add('good');fb.className='feedback';fb.innerHTML='<div class="confetti" aria-hidden="true">🎉⭐🎉</div><div>Yay! Well done!</div><p>你幫到小動物啦！</p>';$('next').classList.remove('hidden');$('skip').classList.add('hidden');say('Yay! '+q.word+' Well done!')}else{button.classList.add('try');fb.className='feedback try';fb.innerHTML='<div>💛 Good try!</div><p>唔緊要，再試一次！</p>';say('Good try! Try again!');setTimeout(()=>{if(!answered){button.classList.remove('try');fb.className='hidden'}},1200)}}
function advance(){round=(round+1)%3;render()}$('start').onclick=()=>{$('welcome').classList.add('hidden');$('game').classList.remove('hidden');render()};$('home').onclick=()=>{$('game').classList.add('hidden');$('welcome').classList.remove('hidden');if(currentAudio){currentAudio.pause();currentAudio=null;}};$('next').onclick=advance;$('skip').onclick=advance;$('speak').onclick=()=>say(sets[mode][round].en);$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 聲音開':'🔇 靜音';$('sound').setAttribute('aria-pressed',String(sound));if(!sound&&currentAudio){currentAudio.pause();currentAudio=null;};voiceStatus(sound?'撳「聽英文」試音 🔊':'🔇 聲音已關閉')};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;round=0;render()});
})();
</script></body></html>
