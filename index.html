<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4df">
<title>彩虹動物小樂園 🌈</title>
<style>
:root{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;color:#493c56;background:#fff8ed}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 10%,#ffe5ef,transparent 35%),radial-gradient(circle at 90% 25%,#dff5ff,transparent 38%),#fff8ed}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #7465d6;outline-offset:3px}.wrap{max-width:720px;margin:auto;padding:18px 15px 35px}.hero{text-align:center;padding:18px 10px}.rainbow{font-size:55px;line-height:1.15}.hero h1{font-size:clamp(27px,6vw,39px);margin:6px 0;color:#a34c8b}.subtitle{font-size:16px;color:#7a6785;margin:5px}.panel{background:#fff;border:3px solid #f9e5f2;border-radius:28px;padding:20px;box-shadow:0 9px 26px #a779ac1c}.intro{text-align:center}.intro .friends{font-size:66px;margin:12px 0}.primary{border:0;background:#ec7bab;color:#fff;border-radius:20px;padding:16px 26px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #c4558a;min-height:62px}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c4558a}.muted{color:#786c81;font-size:14px}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.smallbtn{border:2px solid #e7dcef;background:#fff;color:#655575;border-radius:14px;padding:11px 13px;font-weight:750;min-height:45px}.stars{font-size:19px;font-weight:850;color:#aa6a18}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.mode{border:3px solid transparent;border-radius:20px;padding:11px 4px;background:#fff;min-height:83px;font-size:17px;font-weight:800;color:#6b5977}.mode span{display:block;font-size:31px}.mode.active{border-color:#e889b3;background:#ffe4ef}.progress{display:flex;gap:7px;justify-content:center;margin:12px}.dot{width:34px;height:9px;background:#e9dce9;border-radius:10px}.dot.active{background:#e982b0}.question{text-align:center;font-size:clamp(23px,5vw,31px);font-weight:900;margin:18px 0 8px}.english{text-align:center;color:#8659a6;font-size:19px;font-weight:800;margin:0 0 12px}.mascot{text-align:center;font-size:65px;margin:5px 0 14px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{border:3px solid #f0e6ef;border-radius:22px;background:#fffdfc;min-height:145px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .12s,border-color .12s}.choice:active{transform:scale(.96)}.choice .emoji{font-size:clamp(28px,6vw,43px);line-height:1.4;overflow-wrap:anywhere}.choice .label{font-size:21px;font-weight:900}.choice.good{background:#e2f9e8;border-color:#4cbd7c}.choice.try{background:#fff1d7;border-color:#f1b34d}.feedback{text-align:center;border-radius:20px;padding:15px;margin-top:17px;background:#e7f8e9;font-weight:800;font-size:19px}.feedback.try{background:#fff3dc}.feedback p{font-size:15px;font-weight:500}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button{flex:1}.voice{display:flex;justify-content:center;margin:10px}.speak{border:2px solid #c9b5ed;border-radius:18px;background:#f2eaff;color:#7350a2;padding:10px 17px;font-weight:850;font-size:17px}.footer{text-align:center;font-size:13px;color:#8b8090;margin-top:18px}.confetti{font-size:31px;letter-spacing:10px;animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(.4);opacity:.1}100%{transform:scale(1);opacity:1}}@media(max-width:400px){.panel{padding:13px}.choice{min-height:123px}.choice .label{font-size:18px}.mode{font-size:15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="wrap"><header class="hero"><div class="rainbow" aria-hidden="true">🌈</div><h1>彩虹動物小樂園</h1><p class="subtitle">Little Rainbow Adventure</p></header>
<section id="welcome" class="panel intro"><div class="friends" aria-hidden="true">🐰 🐱 🐻</div><h2>一齊幫小動物玩遊戲！</h2><p>數數字・搵動物・認顏色</p><p class="muted">慢慢玩，唔使急，指一指都好叻！</p><button id="start" class="primary">▶ 開始遊戲</button><p class="muted">建議由大人陪同，每次玩 3–5 分鐘</p></section>
<section id="game" class="hidden"><div class="topbar"><button id="home" class="smallbtn">⌂ 主頁</button><div class="stars" aria-live="polite">⭐ <span id="score">0</span> 粒星星</div><button id="sound" class="smallbtn" aria-pressed="true">🔊 聲音開</button></div><div class="modes" role="group" aria-label="選擇遊戲"><button class="mode active" data-mode="number"><span>🐰</span>數字</button><button class="mode" data-mode="animal"><span>🐱</span>動物</button><button class="mode" data-mode="color"><span>🎨</span>顏色</button></div><div class="panel"><div id="progress" class="progress"></div><div id="question" class="question"></div><div id="english" class="english"></div><div class="voice"><button id="speak" class="speak">🔊 聽英文</button></div><div id="mascot" class="mascot" aria-hidden="true"></div><div id="choices" class="choices"></div><div id="feedback" class="hidden" aria-live="polite"></div><div class="actions"><button id="skip" class="smallbtn">⏭ 換一題</button><button id="next" class="primary hidden">下一關 ➜</button></div></div></section><p class="footer">💗 玩得開心最重要・不需登入・不收集資料</p></main>
<script>
(()=>{'use strict';
const sets={number:[{zh:'幫兔兔搵 TWO 條紅蘿蔔！',en:'Two carrots, please!',mascot:'🐰',options:[['one','🥕','1'],['two','🥕🥕','2'],['three','🥕🥕🥕','3']],correct:'two',word:'Two!'},{zh:'小熊想要 ONE 個蘋果！',en:'One apple, please!',mascot:'🐻',options:[['three','🍎🍎🍎','3'],['one','🍎','1'],['two','🍎🍎','2']],correct:'one',word:'One!'},{zh:'搵 THREE 粒星星！',en:'Three stars!',mascot:'🐰',options:[['two','⭐️⭐️','2'],['three','⭐️⭐️⭐️','3'],['one','⭐️','1']],correct:'three',word:'Three!'}],animal:[{zh:'小貓喺邊度呀？',en:'Where is the cat?',mascot:'🌳🌼',options:[['dog','🐶','Dog'],['cat','🐱','Cat'],['duck','🦆','Duck']],correct:'cat',word:'Cat!'},{zh:'搵下隻 DOG！',en:'Where is the dog?',mascot:'🌷🌳',options:[['cat','🐱','Cat'],['duck','🦆','Duck'],['dog','🐶','Dog']],correct:'dog',word:'Dog!'},{zh:'邊隻係 DUCK？',en:'Where is the duck?',mascot:'🌻🌿',options:[['duck','🦆','Duck'],['dog','🐶','Dog'],['cat','🐱','Cat']],correct:'duck',word:'Duck!'}],color:[{zh:'搵 RED 紅色波波！',en:'Find red!',mascot:'🌈',options:[['blue','🔵','Blue'],['red','🔴','Red'],['yellow','🟡','Yellow']],correct:'red',word:'Red!'},{zh:'搵 BLUE 藍色波波！',en:'Find blue!',mascot:'🌈',options:[['yellow','🟡','Yellow'],['red','🔴','Red'],['blue','🔵','Blue']],correct:'blue',word:'Blue!'},{zh:'搵 YELLOW 黃色波波！',en:'Find yellow!',mascot:'🌈',options:[['red','🔴','Red'],['yellow','🟡','Yellow'],['blue','🔵','Blue']],correct:'yellow',word:'Yellow!'}]};
let mode='number',round=0,score=0,answered=false,sound=true;const $=id=>document.getElementById(id);function say(s){if(!sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.78;u.pitch=1.12;speechSynthesis.speak(u)}catch(e){}}
function render(){answered=false;const q=sets[mode][round];$('score').textContent=score;$('question').textContent=q.zh;$('english').textContent=q.en;$('mascot').textContent=q.mascot;$('feedback').className='hidden';$('feedback').textContent='';$('next').classList.add('hidden');$('skip').classList.remove('hidden');$('progress').replaceChildren(...[0,1,2].map(i=>{const d=document.createElement('span');d.className='dot'+(i===round?' active':'');return d}));document.querySelectorAll('.mode').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('choices').replaceChildren(...q.options.map(o=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-label',o[2]);const e=document.createElement('span');e.className='emoji';e.textContent=o[1];const l=document.createElement('span');l.className='label';l.textContent=o[2];b.append(e,l);b.onclick=()=>pick(o[0],b);return b}));}
function pick(value,button){if(answered)return;const q=sets[mode][round];const fb=$('feedback');if(value===q.correct){answered=true;score++;$('score').textContent=score;button.classList.add('good');fb.className='feedback';fb.innerHTML='<div class="confetti" aria-hidden="true">🎉⭐🎉</div><div>Yay! Well done!</div><p>你幫到小動物啦！</p>';$('next').classList.remove('hidden');$('skip').classList.add('hidden');say('Yay! '+q.word+' Well done!')}else{button.classList.add('try');fb.className='feedback try';fb.innerHTML='<div>💛 Good try!</div><p>唔緊要，再試一次！</p>';say('Good try! Try again!');setTimeout(()=>{if(!answered){button.classList.remove('try');fb.className='hidden'}},1200)}}
function advance(){round=(round+1)%3;render()}$('start').onclick=()=>{$('welcome').classList.add('hidden');$('game').classList.remove('hidden');render()};$('home').onclick=()=>{$('game').classList.add('hidden');$('welcome').classList.remove('hidden');if('speechSynthesis'in window)speechSynthesis.cancel()};$('next').onclick=advance;$('skip').onclick=advance;$('speak').onclick=()=>say(sets[mode][round].en);$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 聲音開':'🔇 靜音';$('sound').setAttribute('aria-pressed',String(sound));if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;round=0;render()});
})();
</script></body></html>
